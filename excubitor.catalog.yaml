# Excubitor catalog 断片 — このリポ自身のサービス定義。
# 公開 Excubitor リポの services.yaml に private 定義 (infisical project_id 等) を
# 焼き込まないため、 各サービスの catalog エントリは自リポに置く。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する (Excubitor catalog/FRAGMENTS.md 参照)。
services:
  - code: volputas
    name: Volputas
    domain: vo-m${DOMAIN_ROOT}
    tier: saas
    project_code: volputas
    subdomain: vo-m
    component: backend
    port: 8892
    repo: LUDIARS/Voluptas
    runtime: node
    cwd: ${ARS_ROOT}/Voluptas/player-profile-server
    command: npm run dev
    allow_hot_reload: true
    depends_on: [infra-postgres, cernere]
    autostart: false
    env:
      PORT: "8892"
      JWT_ISSUER: http://localhost:8892
      GOOGLE_CALLBACK_URL: http://localhost:8892/auth/callback
      DISCORD_CALLBACK_URL: http://localhost:8892/auth/callback
    required_env: [CERNERE_BASE_URL, VOLPUTAS_URL, VOLPUTAS_DATABASE_URL]
    infisical:
      project_id: 19c9e77d-646c-4a0e-a091-b494234953ea
      environment: dev
      inject: true
      include: [VOLPUTAS_DATABASE_URL]
    requires_secret:
      - service: cernere
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    cernere_launch_credentials:
      target_project: volputas
    health:
      type: http
      url: http://localhost:8892/health
      interval_sec: 30
    provides:
      VOLPUTAS_URL: http://${host}:${port}

  - code: volputas-haster
    name: Volputas HASTER
    # 通常運用では起動させない。 HASTER は公開 fixture identity を使う使い捨ての
    # 統合テスト環境で (spec/test/haster-public-user.md)、 本番と同じ形式の
    # 検証には使えない。 起動できる状態のまま置くと「経路を通すため」に
    # 立ち上げてしまい、 実データがテスト環境の DB へ入る事故になる。
    # supervisor は disabled なサービスの stop 以外を SERVICE_DISABLED で拒否する。
    disabled: true
    tier: local-app
    project_code: volputas
    component: backend
    port: 18892
    repo: LUDIARS/Volputas
    runtime: node
    cwd: ${ARS_ROOT}/Voluptas/player-profile-server
    command: npm run dev
    allow_hot_reload: true
    depends_on: [infra-postgres, cernere, discutere]
    autostart: false
    env:
      PORT: "18892"
      VOLPUTAS_ENVIRONMENT: HASTER
      JWT_ISSUER: http://localhost:18892
      # 自分自身の URL は自分の env で持つ。 provides で配ると topology は
      # 後勝ちで全消費者の VOLPUTAS_URL を 18892 へ上書きしてしまい、
      # GLAB など本来 8892 を見るサービスが HASTER へ繋がる。
      # (優先順位は topology < env: なので、 ここでの指定は自分にだけ効く)
      VOLPUTAS_URL: http://localhost:18892
      CERNERE_OIDC_CALLBACK_URL: http://localhost:18892/auth/callback
      VOLPUTAS_PERSONA_EXPORT_TOKEN: haster-public-persona-export-token-v1
      VOLPUTAS_PSEUDO_ID_SECRET: haster-public-pseudo-id-secret-v1
    required_env:
      - CERNERE_BASE_URL
      - VOLPUTAS_URL
      - VOLPUTAS_DATABASE_URL
      - CERNERE_OIDC_CLIENT_ID
      - CERNERE_OIDC_CLIENT_SECRET
      - DISCUTERE_PERSONA_BRIDGE_URL
      - DISCUTERE_PERSONA_BRIDGE_TOKEN
      - DISCUTERE_PERSONA_BRIDGE_ASSERTION_PRIVATE_KEY
    infisical:
      project_id: 19c9e77d-646c-4a0e-a091-b494234953ea
      environment: dev
      inject: true
      include:
        - VOLPUTAS_DATABASE_URL
        - CERNERE_OIDC_CLIENT_ID
        - CERNERE_OIDC_CLIENT_SECRET
        - DISCUTERE_PERSONA_BRIDGE_URL
        - DISCUTERE_PERSONA_BRIDGE_TOKEN
        - DISCUTERE_PERSONA_BRIDGE_ASSERTION_PRIVATE_KEY
    requires_secret:
      - service: cernere
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    cernere_launch_credentials:
      target_project: volputas
    health:
      type: http
      url: http://localhost:18892/health
      interval_sec: 30
