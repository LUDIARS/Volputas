services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-player_profile}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.media-dev}
    ports:
      - "55432:5432"
    volumes:
      - volputas-media-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env.media-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env.media-dev}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
    command: server /data --console-address :9001
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - volputas-media-objects:/data

  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env.media-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env.media-dev}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-volputas-media}
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${MEDIA_S3_BUCKET}"

  migrate:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-player_profile}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.media-dev}
    command: npm run migrate
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: &application-environment
      NODE_ENV: development
      AUTH_SOURCES: google,discord
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-player_profile}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.media-dev}
      REDIS_URL: redis://redis:6379
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: http://127.0.0.1:59000
      MEDIA_S3_REGION: ap-northeast-1
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-volputas-media}
      MEDIA_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env.media-dev}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env.media-dev}
      MEDIA_S3_FORCE_PATH_STYLE: "true"
      VOLUPTAS_PSEUDO_ID_SECRET: ${VOLUPTAS_PSEUDO_ID_SECRET:?VOLUPTAS_PSEUDO_ID_SECRET is required in .env.media-dev}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "53000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  media-worker:
    build: .
    environment: *application-environment
    command: ["/bin/sh", "-ec", "freshclam --stdout && npm run worker:spectator-media"]
    volumes:
      - volputas-clam-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "ps | grep '[r]un-media-worker.js' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  volputas-media-db:
  volputas-media-objects:
  volputas-clam-db:
